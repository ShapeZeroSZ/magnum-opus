[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magnum-opus"
version = "0.3.6"
description = "Distill AI chat exports into a completion-focused, convergence-aware Obsidian vault"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
converge = ["sentence-transformers>=3.0", "scikit-learn>=1.4"]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
magnum = "magnum_opus.cli:main"
